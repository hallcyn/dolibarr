services:
  mariadb:
    image: mariadb:12.3.3
    restart: unless-stopped
    command: ["--bind-address=0.0.0.0,::", "--innodb-buffer-pool-size=128M", "--max-connections=30", "--innodb-snapshot-isolation=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: dolibarr
      MARIADB_USER: dolibarr
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Run python3 scripts/setup-local.py first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run python3 scripts/setup-local.py first}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
  dolibarr:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DOLI_DB_HOST: mariadb
      DOLI_DB_HOST_PORT: "3306"
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: ${MARIADB_PASSWORD:?Run python3 scripts/setup-local.py first}
      DOLI_URL_ROOT: ${DOLI_URL_ROOT:-http://localhost:8080}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN:-admin}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD:?Run python3 scripts/setup-local.py first}
      DOLI_INSTANCE_UNIQUE_ID: ${DOLI_INSTANCE_UNIQUE_ID:?Run python3 scripts/setup-local.py first}
      DOLI_COMPANY_NAME: ${DOLI_COMPANY_NAME:-Mon entreprise}
      DOLI_COMPANY_COUNTRYCODE: ${DOLI_COMPANY_COUNTRYCODE:-FR}
      DOLI_CRON_KEY: ${DOLI_CRON_KEY:?Run python3 scripts/setup-local.py first}
      DOLI_RAILWAY_CRON: ${DOLI_RAILWAY_CRON:-0}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - dolibarr-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/railway-health.php"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend]
volumes:
  mariadb-data:
  dolibarr-data:
networks:
  backend:
