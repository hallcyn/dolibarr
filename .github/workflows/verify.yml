name: Verify Dolibarr deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository and documentation
        run: |
          python3 -m pip install PyYAML
          python3 tests/check_repository.py
          python3 scripts/setup-local.py
          docker compose config --quiet
      - name: Build the image
        run: docker compose build --pull
      - name: PHP and Apache syntax
        run: |
          docker compose run --rm --no-deps --entrypoint bash dolibarr -c 'find /opt/railway /var/www/html/indyinvoice /var/www/html/theme/indy /var/www/html/indyui -name "*.php" -print0 | xargs -0 -n1 php -l; apache2ctl configtest'
      - name: Start services
        run: docker compose up -d
      - name: Check installation and durable state
        run: python3 tests/smoke.py
      - name: Verify Indy on real Dolibarr screens
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          docker compose cp tests/indy/seed.php dolibarr:/tmp/indy-seed.php
          docker compose exec --user www-data -T dolibarr php /tmp/indy-seed.php
          # Audit the small UI dataset before PDF scenarios add ten invoices
          # and a long order; keep list pagination fixtures independent.
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          settings = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines() if line and not line.startswith('#'))
          for script in ('tests/indy/browser.py', 'tests/indy/usability.py', 'tests/indy/responsive.py', 'tests/indy/profile.py'):
              subprocess.run(['python3', script], check=True, env={**os.environ, 'DOLIBARR_TEST_PASSWORD': settings['DOLI_ADMIN_PASSWORD']})
          PY
          docker compose cp tests/invoices/generate.php dolibarr:/tmp/indy-invoices.php
          docker compose exec --user www-data -T dolibarr php /tmp/indy-invoices.php /tmp/indy-invoice-fixtures
          mkdir -p artifacts/invoices
          docker compose cp dolibarr:/tmp/indy-invoice-fixtures/. artifacts/invoices/
          python3 -m pip install PyMuPDF==1.26.6
          python3 tests/invoices/verify.py
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          settings = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines() if line and not line.startswith('#'))
          subprocess.run(['python3', 'tests/invoices/browser.py'], check=True, env={**os.environ, 'DOLIBARR_TEST_PASSWORD': settings['DOLI_ADMIN_PASSWORD']})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indy-screenshots
          path: artifacts/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200
          docker compose exec -T dolibarr bash -c 'ls -ld /data /data/documents /data/custom /var/www/documents; ls -l /data/documents/install.lock; tail -n 40 /data/documents/initdb.log' || true
      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  computed-fields:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable Dolibarr and test native computed dates
        run: |
          python3 scripts/setup-local.py
          docker compose build --pull
          docker compose up -d --wait --wait-timeout 300
          docker compose cp tests/indy/seed.php dolibarr:/tmp/indy-seed.php
          docker compose exec --user www-data -T dolibarr php /tmp/indy-seed.php
          docker compose cp tests/computed-fields.php dolibarr:/tmp/indy-computed-fields.php
          docker compose exec --user www-data -T dolibarr php /tmp/indy-computed-fields.php
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop disposable services
        if: always()
        run: docker compose down --volumes

  billing-recipient:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test billing recipients on native invoice, credit-note and order PDFs
        run: |
          python3 scripts/setup-local.py
          docker compose build --pull
          docker compose up -d --wait --wait-timeout 300
          docker compose cp tests/indy/seed.php dolibarr:/tmp/indy-seed.php
          docker compose exec --user www-data -T dolibarr php /tmp/indy-seed.php
          docker compose cp tests/invoices/recipient.php dolibarr:/tmp/indy-recipient.php
          docker compose exec --user www-data -T dolibarr php /tmp/indy-recipient.php
          mkdir -p artifacts/recipients
          docker compose cp dolibarr:/tmp/indy-recipient-fixtures/. artifacts/recipients/
          python3 -m pip install PyMuPDF==1.26.6
          python3 tests/invoices/recipient.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indy-billing-recipients
          path: artifacts/recipients/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop disposable services
        if: always()
        run: docker compose down --volumes
