name: Verify Dolibarr deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository and documentation
        run: |
          python3 -m pip install PyYAML
          python3 tests/check_repository.py
          python3 scripts/setup-local.py
          docker compose config --quiet
      - name: Build the image
        run: docker compose build --pull
      - name: PHP and Apache syntax
        run: |
          docker compose run --rm --no-deps --entrypoint bash dolibarr -c 'find /opt/railway -name "*.php" -print0 | xargs -0 -n1 php -l; apache2ctl configtest'
      - name: Start services
        run: docker compose up -d
      - name: Check installation and durable state
        run: python3 tests/smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop test services
        if: always()
        run: docker compose down --volumes
