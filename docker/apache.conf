ServerName localhost
ServerTokens Prod
ServerSignature Off
# TLS is terminated by Railway's edge. Never expose this origin directly.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
<Directory /var/www/html/custom>
    Options -Indexes
    Require all granted
</Directory>
<Directory /data/custom>
    Options -Indexes
    Require all granted
</Directory>
